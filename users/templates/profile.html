{% extends "layouts/base.html" %}
{% block title %}Perfil{% endblock title %}

{% block content %}
<h1 class="title">Perfil</h1>
<div class="profile-page">
    <div class="profile-card">

        <div class="profile-card__header">
            <div class="profile-avatar">
                {{ user.username|first|upper }}
            </div>
            <h1 class="profile-name">{{ user.username }}</h1>
        </div>

        <div class="profile-card__body">
            <div class="profile-field">
                <span class="profile-field__label">Email</span>
                <span class="profile-field__value">{{ user.email }}</span>
            </div>
            <div class="profile-field">
                <span class="profile-field__label">Te uniste</span>
                <span class="profile-field__value">{{ user.date_joined }}</span>
            </div>
        </div>

        <div class="profile-card__actions">
            <a href="{% url 'password_change' %}" class="btn btn-primary">Cambiar contraseña</a>
        </div>

    </div>
</div>
{% endblock content %}

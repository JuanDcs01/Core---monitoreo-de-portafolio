{% extends "layouts/base.html" %}
{% block title %}Perfil{% endblock title %}

{% block content %}
<div class="center-container">
    <section class="panel profile">
        <div class="profile-top">
            <div class="profile-avatar">{{ user.username|first|upper }}</div>
            <h1 class="profile-name">{{ user.username }}</h1>
        </div>

        <div class="profile-meta">
            <div class="kv"><span><i class="bi bi-envelope"></i> Email</span><strong>{{ user.email }}</strong></div>
            <div class="kv"><span><i class="bi bi-calendar3"></i> Te uniste</span><strong>{{ user.date_joined }}</strong></div>
        </div>

        <div class="profile-actions">
            <a href="{% url 'password_change' %}" class="btn btn-primary w-100"><i class="bi bi-key"></i> Cambiar contraseña</a>
        </div>
    </section>
</div>
{% endblock content %}

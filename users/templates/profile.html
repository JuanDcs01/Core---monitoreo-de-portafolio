{% extends "layouts/base.html" %}
{% block title %}Perfil{% endblock title %}

{% block content %}
<div class="center">
    <div class="d-flex flex-column justify-content-center align-items-center">

        <div>
            <h2>{{ user.username }}</h2>
        </div>

        <div>
            <span>Email:</span>
            <span>{{ user.email }}</span>
        </div>  
        <div class="mb-3">      
            <span>Te uniste:</span>
            <span>{{ user.date_joined }}</span>
        </div>

        <div>
            <a href="{% url 'password_change' %}" class="btn btn-dark">Cambiar contraseña</a>
        </div>
    </div>
</div>
{% endblock content %}

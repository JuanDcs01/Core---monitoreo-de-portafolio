{% extends "layouts/base.html" %}
{% block title %}Restauración completada{% endblock title %}
{% block content %}

<div class="status-card">
    <div class="status-icon"><i class="bi bi-check-lg"></i></div>
    <h1 class="title status-title">Contraseña actualizada</h1>
    <p class="status-text">
        Ya puedes iniciar sesión con tu nueva contraseña.
    </p>
    <div class="status-actions">
        <a href="{% url 'login' %}" class="a-as-btn btn-fixed-width btn-primary">Iniciar sesión</a>
    </div>
</div>

{% endblock content %}

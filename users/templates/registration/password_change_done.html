{% extends "layouts/base.html" %}
{% block title %}Cambiar contraseña{% endblock title %}
{% block content %}

<div class="status-card">
    <div class="status-icon"><i class="bi bi-check-lg"></i></div>
    <h1 class="title status-title">Contraseña actualizada</h1>
    <p class="status-text">
        Tu contraseña fue cambiada correctamente.
    </p>
    <div class="status-actions">
        <a href="{% url 'profile' %}" class="a-as-btn btn-primary btn-fixed-width">Continuar</a>
    </div>
</div>

{% endblock content %}

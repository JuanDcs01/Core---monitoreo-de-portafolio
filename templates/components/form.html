<div style="width: 30%">
    {{ title }}

    {% for error in form.errors.values %}
        {{ error }}
    {% endfor %}
    <form action="" method="post">
        {% csrf_token %}
        {% for f in form %}
            {{ f.label }}
            {{ f }}
            {{ f.errors }}
            {{ f.help_text }}
        {% endfor %}
        <button type="submit">{{ button }}</button>
    </form>
</div>

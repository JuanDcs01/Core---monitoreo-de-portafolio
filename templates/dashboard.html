{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tracker de Acciones en Tiempo Real</title>
    <!-- Bootstrap para estilos rápidos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Panel Financiero en Tiempo Real (Finnhub)</h2>

        <!-- Buscador para agregar nuevos símbolos -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="symbol-input" class="form-control" placeholder="Agregar símbolo (ej. TSLA, MSFT)">
                    <button class="btn btn-primary" id="add-symbol-btn" type="button">Agregar</button>
                </div>
                <div id="symbol-error" class="text-danger small mt-1"></div>
            </div>
        </div>

        <div class="row" id="stock-container">
            <!-- Las tarjetas de símbolos se generan dinámicamente aquí -->
        </div>
    </div>

    <!-- Config para el JS estático (dashboard.js). json_script serializa el
         dict de forma segura (auto-escapado), así el .js queda 100% estático
         y cacheable: no depende de que Django lo re-genere por request. -->
    {{ dashboard_config|json_script:"dashboard-config" }}
    <script src="{% static 'js/dashboard.js' %}"></script>
</body>
</html>
